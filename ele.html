<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد المصرفي - البنك الموريتاني للتجارة الدولية</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f7f7f7;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      padding: 20px 0;
      background-color: #0a3d62;
      color: white;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .header img {
      height: 50px;
      margin-bottom: 10px;
    }
    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .chat-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: white;
      border-left: 1px solid #e0e0e0;
      border-right: 1px solid #e0e0e0;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 8px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.5;
      position: relative;
    }
    .user-message {
      background-color: #e7f3ff;
      color: #0a3d62;
      margin-left: auto;
      border-bottom-right-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .bot-message {
      background-color: #f0f0f0;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .error-message {
      background-color: #fff0f0;
      color: #c00;
      margin-right: auto;
      border-bottom-left-radius: 2px;
      border-left: 3px solid #c00;
    }
    .message-time {
      font-size: 11px;
      color: #777;
      display: block;
      margin-top: 5px;
      text-align: left;
    }
    .input-container {
      display: flex;
      padding: 15px;
      background-color: white;
      border-top: 1px solid #e0e0e0;
      border-left: 1px solid #e0e0e0;
      border-right: 1px solid #e0e0e0;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 -1px 5px rgba(0,0,0,0.05);
    }
    #user-input {
      flex-grow: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-left: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    #user-input:focus {
      outline: none;
      border-color: #0a3d62;
      box-shadow: 0 0 0 2px rgba(10,61,98,0.1);
    }
    button {
      padding: 12px 20px;
      background-color: #0a3d62;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0c4b79;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .loading {
      display: none;
      text-align: center;
      margin: 10px 0;
    }
    .dots {
      display: inline-block;
    }
    .dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #0a3d62;
      margin: 0 2px;
      animation: dots 1.4s infinite ease-in-out both;
    }
    .dots span:nth-child(1) { animation-delay: -0.32s; }
    .dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dots {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .settings-panel {
      margin: 20px 0;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .settings-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      justify-content: space-between;
    }
    .settings-label {
      font-weight: bold;
      margin-left: 10px;
      color: #0a3d62;
    }
    .settings-input {
      width: 70%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      transition: border-color 0.3s;
    }
    .settings-input:focus {
      outline: none;
      border-color: #0a3d62;
    }
    .show-settings {
      text-align: center;
      margin-bottom: 15px;
    }
    .show-settings button {
      background-color: #f0f0f0;
      color: #333;
      font-size: 13px;
      padding: 8px 15px;
    }
    .show-settings button:hover {
      background-color: #e0e0e0;
    }
    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }
    .bank-logo {
      width: 120px;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/api/placeholder/240/60" alt="شعار البنك الموريتاني للتجارة الدولية" class="bank-logo">
      <h1>المساعد المصرفي الآلي</h1>
      <p>البنك الموريتاني للتجارة الدولية (بي إم سي آي)</p>
    </div>
    
    <div class="show-settings">
      <button id="toggle-settings">إعدادات المساعد المصرفي</button>
    </div>
    
    <div class="settings-panel" id="settings-panel" style="display:none;">
      <div class="settings-row">
        <span class="settings-label">مفتاح API:</span>
        <input type="text" id="api-key" class="settings-input" value="AIzaSyAWzWH61m3KpFcvqZoiauuPszVscaOg_E4" placeholder="أدخل مفتاح API هنا" />
      </div>
      <div class="settings-row">
        <span class="settings-label">نموذج:</span>
        <select id="model-select" class="settings-input">
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
          <option value="gemini-1.5-flash" selected>Gemini 1.5 Flash</option>
        </select>
      </div>
      <div class="settings-row">
        <span class="settings-label">درجة الإبداعية:</span>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.2" class="settings-input" />
        <span id="temperature-value">0.2</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">الحد الأقصى للرموز:</span>
        <input type="number" id="max-tokens" min="100" max="8192" step="100" value="1000" class="settings-input" />
      </div>
      <div class="settings-row">
        <button id="save-settings">حفظ الإعدادات</button>
        <button id="test-connection">اختبار الاتصال</button>
      </div>
    </div>
    
    <div class="chat-container" id="chat-container">
      <div class="message bot-message">
        السلام عليكم ورحمة الله، أنا المساعد المصرفي من البنك الموريتاني للتجارة الدولية. كيف يمكنني خدمتكم اليوم؟
        <span class="message-time" id="current-time"></span>
      </div>
    </div>
    
    <div class="loading" id="loading">
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    
    <div class="input-container">
      <input type="text" id="user-input" placeholder="اكتب استفسارك هنا..." />
      <button id="send-button">إرسال</button>
    </div>
    
    <div class="footer">
      جميع الحقوق محفوظة &copy; البنك الموريتاني للتجارة الدولية
    </div>
  </div>

  <script>
    // العناصر الرئيسية
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const loadingIndicator = document.getElementById('loading');
    const settingsPanel = document.getElementById('settings-panel');
    const toggleSettingsButton = document.getElementById('toggle-settings');
    const saveSettingsButton = document.getElementById('save-settings');
    const testConnectionButton = document.getElementById('test-connection');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model-select');
    const temperatureSlider = document.getElementById('temperature');
    const temperatureValue = document.getElementById('temperature-value');
    const maxTokensInput = document.getElementById('max-tokens');
    
    // إظهار الوقت الحالي في أول رسالة
    const currentTimeElement = document.getElementById('current-time');
    const now = new Date();
    currentTimeElement.textContent = now.toLocaleTimeString('ar-MR');
    
    // إعدادات افتراضية
    let settings = {
      apiKey: 'AIzaSyAWzWH61m3KpFcvqZoiauuPszVscaOg_E4',
      model: 'gemini-1.5-flash',
      temperature: 0.2,
      maxTokens: 1000
    };
    
    // النظام الأساسي للمساعد المصرفي
    const systemPrompt = `
    [Identity]
    أنت المساعد الصوتي الرسمي للبنك الموريتاني للتجارة الدولية (بي إم سي آي)، تقدم خدمة استشارية متخصصة للعملاء حول الخدمات المصرفية، ساعات العمل، مواقع الفروع، والإرشاد التقني لاستخدام المنصات الرقمية مثل تطبيق "مصرفي" و"بي إم سي آي موبايل"، مع الالتزام التام بسياسات أمن المعلومات وخصوصية العملاء.

    [Style]
    اعتمد أسلوباً مهنياً رصيناً مع لمسة شخصية دافئة، مستخدماً اللغة العربية الفصحى بطلاقة وسلاسة. تعامل بحساسية ثقافية مع اللهجة الحسانية الموريتانية، وقدم المعلومات بدقة ووضوح. استخدم عبارات التقدير المناسبة للسياق المحلي، مع الحفاظ على الطابع المؤسسي الرسمي للبنك.

    [Response Guidelines]
    التزم بأعلى معايير السرية وأمن المعلومات المصرفية.
    قدم معلومات دقيقة ومحدثة حول الخدمات والمنتجات المصرفية العامة.
    صغ الأسئلة التوضيحية بعناية لتحقيق فهم دقيق لاحتياجات العميل.
    قدم إجابات مختصرة ومكثفة، مع التركيز على القيمة المعلوماتية.
    انطق جميع الأرقام والرموز بشكل صحيح باللغة العربية الفصحى، متجنباً الأخطاء اللفظية.

    [Task & Goals]
    1. تقديم المعلومات بدقة متناهية:
       "تعمل فروعنا المصرفية من الساعة الثامنة صباحاً وحتى الساعة الثالثة والنصف مساءً، من يوم الأحد إلى يوم الخميس."
       "لاستخدام خدمات تطبيق بي إم سي آي موبايل، يرجى الدخول إلى واجهة التطبيق الرئيسية واختيار الخدمة المصرفية المطلوبة من القائمة."
    2. التعامل مع الاستفسارات التقنية:
       - قدم حلولاً تدريجية وفق أفضل الممارسات المصرفية والتقنية.
       - في حالات التعقيد أو الحاجة لتدخل متخصص، قم بتوجيه العميل إلى خدمة الدعم المناسبة أو الفرع المصرفي.

    [Error Handling / Fallback]
    عند عدم وضوح الاستفسار: "أعتذر عن عدم الفهم الكامل لاستفساركم، هل يمكنكم إعادة صياغته بشكل مختلف لأتمكن من تقديم الخدمة المثلى؟"
    للاستفسارات التي تتطلب معلومات حساسة: "حرصاً على أمن معلوماتكم المصرفية، يُفضل زيارة أقرب فرع أو التواصل مع خدمة العملاء المباشرة على الرقم الرسمي للبنك."
    في حالة الاضطرابات التقنية: "نعتذر عن الانقطاع التقني المؤقت في الخدمة. فرق الدعم الفني تعمل على استعادة الخدمة بالكامل. يمكنكم معاودة الاتصال لاحقاً أو زيارة أقرب فرع للحصول على المساعدة الفورية."

    [Call Closing]
    "نشكر ثقتكم الغالية في البنك الموريتاني للتجارة الدولية. فريقنا المتخصص يقف دائماً في خدمتكم. نتمنى لكم يوماً موفقاً."
    `;
    
    // معلومات عامة عن البنك (نماذج من المعلومات)
    const bankInfo = {
      workingHours: "تعمل فروعنا المصرفية من الساعة الثامنة صباحاً وحتى الساعة الثالثة والنصف مساءً، من يوم الأحد إلى يوم الخميس.",
      locations: [
        "الفرع الرئيسي: شارع الاستقلال، نواكشوط",
        "فرع نواذيبو: شارع الميناء، نواذيبو",
        "فرع روصو: وسط المدينة، روصو"
      ],
      services: [
        "الحسابات المصرفية (جارية، توفير، استثمارية)",
        "بطاقات الائتمان والخصم المباشر",
        "القروض الشخصية والعقارية",
        "خدمات التحويل المالي محلياً ودولياً",
        "تطبيق بي إم سي آي موبايل للخدمات المصرفية الإلكترونية"
      ],
      support: "الخط الساخن: 45252525"
    };
    
    // تحميل الإعدادات من التخزين المحلي إن وجدت
    const loadSettings = () => {
      const savedSettings = localStorage.getItem('bmciChatSettings');
      if (savedSettings) {
        settings = JSON.parse(savedSettings);
        apiKeyInput.value = settings.apiKey;
        modelSelect.value = settings.model;
        temperatureSlider.value = settings.temperature;
        temperatureValue.textContent = settings.temperature;
        maxTokensInput.value = settings.maxTokens;
      }
    };
    
    // حفظ الإعدادات في التخزين المحلي
    const saveSettings = () => {
      settings.apiKey = apiKeyInput.value.trim();
      settings.model = modelSelect.value;
      settings.temperature = parseFloat(temperatureSlider.value);
      settings.maxTokens = parseInt(maxTokensInput.value);
      
      localStorage.setItem('bmciChatSettings', JSON.stringify(settings));
      addMessage('تم حفظ إعدادات المساعد المصرفي بنجاح!', false);
      settingsPanel.style.display = 'none';
    };
    
    // اختبار الاتصال مع API
    const testConnection = async () => {
      const testApiKey = apiKeyInput.value.trim();
      const testModel = modelSelect.value;
      
      if (!testApiKey) {
        addErrorMessage('الرجاء إدخال مفتاح API أولاً');
        return;
      }
      
      testConnectionButton.disabled = true;
      testConnectionButton.textContent = 'جاري الاختبار...';
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${testModel}:generateContent?key=${testApiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [{ text: "اختبار اتصال. الرجاء الرد بعبارة 'تم الاتصال بنجاح'" }]
              }
            ],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 10,
            }
          }),
        });
        
        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content) {
          addMessage('✅ تم الاتصال بنجاح مع API!', false);
        } else if (data.error) {
          addErrorMessage(`❌ فشل الاتصال: ${data.error.message}`);
        } else {
          addErrorMessage('❌ فشل الاتصال بطريقة غير متوقعة');
        }
      } catch (error) {
        addErrorMessage(`❌ خطأ في الاتصال: ${error.message}`);
      } finally {
        testConnectionButton.disabled = false;
        testConnectionButton.textContent = 'اختبار الاتصال';
      }
    };
    
    // سجل المحادثة للحفاظ على السياق
    let conversationHistory = [
      { role: "system", parts: [{ text: systemPrompt }] },
      { role: "model", parts: [{ text: "السلام عليكم ورحمة الله، أنا المساعد المصرفي من البنك الموريتاني للتجارة الدولية. كيف يمكنني خدمتكم اليوم؟" }] }
    ];
    
    // إضافة رسالة إلى واجهة المستخدم
    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
      messageDiv.textContent = text;
      
      // إضافة الوقت
      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      const now = new Date();
      timeSpan.textContent = now.toLocaleTimeString('ar-MR');
      messageDiv.appendChild(timeSpan);
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    // إضافة رسالة خطأ
    function addErrorMessage(text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message error-message';
      messageDiv.textContent = text;
      
      // إضافة الوقت
      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      const now = new Date();
      timeSpan.textContent = now.toLocaleTimeString('ar-MR');
      messageDiv.appendChild(timeSpan);
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    // إرسال رسالة إلى API Gemini
    async function sendToGemini(message) {
      try {
        // إظهار مؤشر التحميل
        loadingIndicator.style.display = 'block';
        sendButton.disabled = true;
        userInput.disabled = true;
        
        // إضافة رسالة المستخدم إلى سجل المحادثة
        conversationHistory.push({ role: "user", parts: [{ text: message }] });
        
        // الحصول على الإعدادات الحالية
        const { apiKey, model, temperature, maxTokens } = settings;
        
        // التحقق من وجود مفتاح API
        if (!apiKey) {
          throw new Error('الرجاء إدخال مفتاح API في الإعدادات');
        }
        
        // تحديد عنوان API
        const apiUrl = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent`;
        
        // إعداد طلب API
        const response = await fetch(`${apiUrl}?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: conversationHistory,
            generationConfig: {
              temperature: temperature,
              topK: 40,
              topP: 0.95,
              maxOutputTokens: maxTokens,
            }
          }),
        });
        
        const data = await response.json();
        
        // إخفاء مؤشر التحميل
        loadingIndicator.style.display = 'none';
        sendButton.disabled = false;
        userInput.disabled = false;
        
        // معالجة أخطاء API
        if (data.error) {
          const errorCode = data.error.code;
          const errorMessage = data.error.message;
          
          let userFriendlyError;
          
          switch(errorCode) {
            case 400:
              userFriendlyError = `خطأ في الطلب: ${errorMessage}`;
              break;
            case 401:
              userFriendlyError = 'خطأ في المصادقة: مفتاح API غير صالح';
              break;
            case 403:
              userFriendlyError = 'غير مصرح: تحقق من صلاحيات مفتاح API الخاص بك';
              break;
            case 404:
              userFriendlyError = `النموذج "${model}" غير موجود`;
              break;
            case 429:
              userFriendlyError = 'تم تجاوز حد معدل الطلبات. حاول مرة أخرى لاحقًا';
              break;
            case 500:
            case 501:
            case 502:
            case 503:
              userFriendlyError = 'خطأ في الخادم. حاول مرة أخرى لاحقًا';
              break;
            default:
              userFriendlyError = `خطأ: ${errorMessage}`;
          }
          
          addErrorMessage(userFriendlyError);
          console.error('خطأ في استجابة API:', data.error);
          
          // إزالة آخر رسالة من المستخدم من السجل إذا فشل الطلب
          conversationHistory.pop();
          return;
        }
        
        // التحقق من وجود رد
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text) {
          const botReply = data.candidates[0].content.parts[0].text;
          
          // إضافة رد البوت إلى سجل المحادثة
          conversationHistory.push({ role: "model", parts: [{ text: botReply }] });
          
          // إضافة الرد إلى واجهة المستخدم
          addMessage(botReply, false);
        } else {
          // إذا لم يكن هناك محتوى
          console.error('لا يوجد محتوى في الرد:', data);
          addErrorMessage('عذراً، لم أتمكن من إنشاء استجابة. حاول صياغة سؤالك بطريقة مختلفة.');
          
          // إزالة آخر رسالة من المستخدم من السجل إذا فشل الطلب
          conversationHistory.pop();
        }
      } catch (error) {
        console.error('خطأ في الاتصال بـ API:', error);
        loadingIndicator.style.display = 'none';
        sendButton.disabled = false;
        userInput.disabled = false;
        
        addErrorMessage(`خطأ: ${error.message}`);
        
        // إزالة آخر رسالة من المستخدم من السجل إذا فشل الطلب
        if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === "user") {
          conversationHistory.pop();
        }
      }
    }
    
    // معالج إرسال الرسائل
    function handleSend() {
      const message = userInput.value.trim();
      if (message) {
        addMessage(message, true);
        userInput.value = '';
        sendToGemini(message);
      }
    }
    
    // تحديث قيمة درجة الحرارة في العرض
    temperatureSlider.addEventListener('input', function() {
      temperatureValue.textContent = this.value;
    });
    
    // مستمعي الأحداث
    sendButton.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });
    
    toggleSettingsButton.addEventListener('click', () => {
      settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
    });
    
    saveSettingsButton.addEventListener('click', saveSettings);
    testConnectionButton.addEventListener('click', testConnection);
    
    // تحميل الإعدادات عند بدء التطبيق
    loadSettings();
  </script>
</body>
</html>
